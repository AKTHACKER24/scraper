name: Discount Living Rooms - Scraper (DRL / TVS / DRO / BFD)

on:
  workflow_dispatch:
    inputs:
      target_site:
        description: "Target site to scrape"
        type: choice
        required: true
        default: "ALL (All 4 Sites: DRL + BFD + DRO + TVSO)"
        options:
          - "ALL (All 4 Sites: DRL + BFD + DRO + TVSO)"
          - "Discount Living Rooms (discountlivingrooms.com)"
          - "Bedroom Furniture Discounts (bedroomfurniturediscounts.com)"
          - "Dining Rooms Outlet (diningroomsoutlet.com)"
          - "TV Stands Outlet (tvstandsoutlet.com)"
      custom_url:
        description: "Custom site URL (optional, overrides target selection if set)"
        required: false
        default: ""
      sitemap_url:
        description: "Custom sitemap URL override (optional, single site only)"
        required: false
        default: ""
      use_ftp_urls:
        description: "Use pre-collected URL lists from FTP (/scrap/urls/) instead of crawling sitemaps"
        type: boolean
        required: false
        default: true
      urls_per_runner:
        description: "Max product URLs to scrape per parallel runner"
        default: "1500"
      total_runners_per_site:
        description: "Parallel runners per site (0 = auto-calculate based on URLs)"
        default: "0"
      max_total_urls:
        description: "Max total URLs to scrape per site (0 = all / full)"
        default: "0"
      max_workers:
        description: "Parallel requests per job"
        default: "10"
      request_delay:
        description: "Delay between requests (seconds)"
        default: "0.2"
      total_sitemaps:
        description: "Legacy: Total sitemaps (deprecated, auto-discovered)"
        default: "0"
      sitemaps_per_job:
        description: "Legacy: Sitemaps per job (deprecated, now partitioned by URLs)"
        default: "1"
      urls_per_sitemap:
        description: "Legacy: Max URLs per sitemap (0 = full scrape / unlimited)"
        default: "0"

env:
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASS: ${{ secrets.FTP_PASS }}
  FTP_PATH: ${{ secrets.FTP_PATH || '/scrap/' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}

    # Service container for Cloudflare bypass during sitemap discovery
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --cap-add=SYS_ADMIN

    steps:
      - uses: actions/checkout@v4

      - name: Wait for FlareSolverr to be ready
        continue-on-error: true
        run: |
          echo "Waiting for FlareSolverr service to be ready..."
          sleep 10
          for i in {1..30}; do
            if curl -s -f -X POST http://localhost:8191/v1 \
              -H "Content-Type: application/json" \
              -d '{"cmd": "sessions.list"}' > /dev/null 2>&1; then
              echo "✓ FlareSolverr is ready!"
              break
            fi
            echo "Attempt $i: FlareSolverr not ready yet..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "⚠ FlareSolverr not ready after 60 seconds, continuing anyway..."
              break
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi cloudscraper lxml

      - name: Discover all sitemaps, count products, and partition runners
        id: generate_matrix
        env:
          TARGET_SITE: ${{ github.event.inputs.target_site }}
          CUSTOM_URL: ${{ github.event.inputs.custom_url }}
          CUSTOM_SITEMAP: ${{ github.event.inputs.sitemap_url }}
          USE_FTP_URLS: ${{ github.event.inputs.use_ftp_urls != 'false' }}
          URLS_PER_RUNNER: ${{ github.event.inputs.urls_per_runner }}
          TOTAL_RUNNERS_PER_SITE: ${{ github.event.inputs.total_runners_per_site }}
          MAX_TOTAL_URLS: ${{ github.event.inputs.max_total_urls }}
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          PROXY: ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
          FTP_HOST: ${{ env.FTP_HOST }}
          FTP_USER: ${{ env.FTP_USER }}
          FTP_PASS: ${{ env.FTP_PASS }}
          FTP_PORT: ${{ env.FTP_PORT }}
          FTP_PATH: ${{ env.FTP_PATH }}
        run: |
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os
          import sys
          import json
          import math
          import subprocess
          import ftplib
          from urllib.parse import urlparse

          target = os.environ.get("TARGET_SITE", "ALL")
          custom_url = os.environ.get("CUSTOM_URL", "").strip()
          custom_sitemap = os.environ.get("CUSTOM_SITEMAP", "").strip()
          use_ftp_urls = os.environ.get("USE_FTP_URLS", "true").lower() in ("true", "1", "yes")
          urls_per_runner = int(os.environ.get("URLS_PER_RUNNER", "1500") or "1500")
          total_runners_input = int(os.environ.get("TOTAL_RUNNERS_PER_SITE", "0") or "0")
          max_total_urls = int(os.environ.get("MAX_TOTAL_URLS", "0") or "0")
          ftp_host = os.environ.get("FTP_HOST", "").strip()
          ftp_user = os.environ.get("FTP_USER", "").strip()
          ftp_pass = os.environ.get("FTP_PASS", "").strip()
          ftp_port = int(os.environ.get("FTP_PORT", "21") or "21")
          ftp_path = os.environ.get("FTP_PATH", "/scrap").rstrip("/")

          all_sites = [
              {
                  "site_key": "discountlivingrooms",
                  "competitor": "DiscountLivingRooms",
                  "url": "https://www.discountlivingrooms.com",
                  "sitemap_url": "https://www.discountlivingrooms.com/sitemaps/sitemap_discount.xml",
              },
              {
                  "site_key": "bedroomfurniturediscounts",
                  "competitor": "Bedroomfurniturediscounts",
                  "url": "https://www.bedroomfurniturediscounts.com",
                  "sitemap_url": "https://www.bedroomfurniturediscounts.com/sitemaps/sitemap.xml",
              },
              {
                  "site_key": "diningroomsoutlet",
                  "competitor": "DiningRoomsOutlet",
                  "url": "https://www.diningroomsoutlet.com",
                  "sitemap_url": "https://www.diningroomsoutlet.com/sitemaps/sitemap_diningrooms.xml",
              },
              {
                  "site_key": "tvstandsoutlet",
                  "competitor": "TvStandsOutlet",
                  "url": "https://www.tvstandsoutlet.com",
                  "sitemap_url": "https://www.tvstandsoutlet.com/sitemaps/sitemap_tvstands.xml",
              },
          ]

          selected = []
          if custom_url:
              domain = urlparse(custom_url).netloc.replace("www.", "").split(".")[0] or "custom"
              comp = domain.capitalize()
              selected = [{
                  "site_key": domain,
                  "competitor": comp,
                  "url": custom_url,
                  "sitemap_url": custom_sitemap,
              }]
          elif "ALL" in target:
              selected = all_sites
          elif "bedroom" in target.lower():
              selected = [s for s in all_sites if s["site_key"] == "bedroomfurniturediscounts"]
          elif "dining" in target.lower():
              selected = [s for s in all_sites if s["site_key"] == "diningroomsoutlet"]
          elif "tv" in target.lower():
              selected = [s for s in all_sites if s["site_key"] == "tvstandsoutlet"]
          else:
              selected = [s for s in all_sites if s["site_key"] == "discountlivingrooms"]

          os.makedirs("url_chunks", exist_ok=True)
          matrix_items = []

          for s in selected:
              site_key = s["site_key"]
              competitor = s["competitor"]
              site_url = s["url"]
              site_sitemap = custom_sitemap if (custom_sitemap and len(selected) == 1) else s["sitemap_url"]
              site_master_file = f"all_urls_{site_key}.txt"
              urls_loaded_from_ftp = False

              if use_ftp_urls:
                  if not (ftp_host and ftp_user and ftp_pass):
                      print("⚠ FTP secrets (FTP_HOST, FTP_USER, FTP_PASS) are not configured. Falling back to sitemap discovery.")
                  else:
                      remote_url_file = f"{ftp_path}/urls/all_urls_{site_key}.txt"
                      print(f"\n============================================================")
                      print(f" Checking FTP for pre-collected URLs: {remote_url_file}")
                      print(f" Site: {site_key} ({competitor})")
                      print(f"============================================================")
                      try:
                          ftp = ftplib.FTP()
                          ftp.connect(ftp_host, ftp_port, timeout=30)
                          ftp.login(ftp_user, ftp_pass)
                          with open(site_master_file, "wb") as f_out:
                              ftp.retrbinary(f"RETR {remote_url_file}", f_out.write)
                          ftp.quit()
                          if os.path.exists(site_master_file) and os.path.getsize(site_master_file) > 0:
                              print(f"✓ Successfully fetched pre-collected URLs from FTP ({os.path.getsize(site_master_file):,} bytes)")
                              urls_loaded_from_ftp = True
                          else:
                              print("⚠ Downloaded file was empty, falling back to sitemap discovery.")
                      except Exception as ex_ftp:
                          print(f"⚠ Could not download URLs from FTP ({ex_ftp}), falling back to sitemap discovery.")

              if not urls_loaded_from_ftp:
                  print(f"\n============================================================")
                  print(f" Checking all sitemaps for site: {site_key} ({competitor})")
                  print(f" Base URL: {site_url}")
                  print(f" Sitemap: {site_sitemap}")
                  print(f"============================================================")

                  env_copy = os.environ.copy()
                  env_copy["CURR_URL"] = site_url
                  env_copy["SITE_NAME"] = site_key
                  env_copy["SITEMAP_URL"] = site_sitemap
                  env_copy["MASTER_URLS_FILE"] = site_master_file
                  env_copy["COLLECT_URLS_ONLY"] = "1"

                  res = subprocess.run([sys.executable, "drl/dlr_scraper.py"], env=env_copy)
                  if res.returncode != 0:
                      print(f"⚠ Warning: URL collection for {site_key} returned code {res.returncode}")

              if not os.path.exists(site_master_file):
                  print(f"⚠ No URL file generated for {site_key}, creating empty file.")
                  with open(site_master_file, "w") as f:
                      pass

              with open(site_master_file, "r", encoding="utf-8") as f:
                  urls = [line.strip() for line in f if line.strip() and line.strip().startswith("http")]

              site_total_urls = len(urls)
              print(f"Total product URLs discovered for {site_key}: {site_total_urls:,}")

              if max_total_urls > 0 and max_total_urls < site_total_urls:
                  print(f"Limiting {site_key} to first {max_total_urls:,} URLs as requested")
                  urls = urls[:max_total_urls]
                  site_total_urls = len(urls)

              if site_total_urls == 0:
                  print(f"No URLs to process for {site_key}, skipping chunk generation.")
                  continue

              if total_runners_input > 0:
                  site_chunks = total_runners_input
                  urls_per_chunk = math.ceil(site_total_urls / site_chunks)
              else:
                  chunk_rate = urls_per_runner if urls_per_runner >= 100 else 1500
                  site_chunks = math.ceil(site_total_urls / chunk_rate)
                  urls_per_chunk = chunk_rate

              # Cap runners per site to prevent exceeding GitHub matrix limits
              max_per_site = 60 if len(selected) > 1 else 100
              if site_chunks > max_per_site:
                  print(f"Capping runners for {site_key} at {max_per_site} (would have been {site_chunks})")
                  site_chunks = max_per_site
                  urls_per_chunk = math.ceil(site_total_urls / site_chunks)

              if site_chunks < 1:
                  site_chunks = 1

              for i in range(site_chunks):
                  start_idx = i * urls_per_chunk
                  end_idx = min(start_idx + urls_per_chunk, site_total_urls)
                  chunk_urls = urls[start_idx:end_idx]
                  if not chunk_urls:
                      continue
                  chunk_file = f"url_chunks/{site_key}_chunk_{i}.txt"
                  with open(chunk_file, "w", encoding="utf-8") as cf:
                      cf.write("\n".join(chunk_urls))
                  matrix_items.append({
                      "site_key": site_key,
                      "competitor": competitor,
                      "url": site_url,
                      "sitemap_url": site_sitemap,
                      "chunk_index": i,
                      "total_chunks": site_chunks,
                      "chunk_file": chunk_file,
                      "url_count": len(chunk_urls),
                  })

              print(f"Divided {site_total_urls:,} URLs for {site_key} into {site_chunks} runners (~{urls_per_chunk:,} URLs/runner)")

          if not matrix_items:
              print("No matrix items generated, creating fallback job.")
              matrix_items.append({
                  "site_key": "discountlivingrooms",
                  "competitor": "DiscountLivingRooms",
                  "url": "https://www.discountlivingrooms.com",
                  "sitemap_url": "https://www.discountlivingrooms.com/sitemaps/sitemap_discount.xml",
                  "chunk_index": 0,
                  "total_chunks": 1,
                  "chunk_file": "",
                  "url_count": 0,
              })

          matrix_json = json.dumps(matrix_items)
          print(f"Total planned jobs across all sites: {len(matrix_items)}")
          with open("matrix.json", "w", encoding="utf-8") as f:
              f.write(matrix_json)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix_json}\n")
          EOF

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlr_matrix
          path: matrix.json
          retention-days: 1

      - name: Upload URL chunks artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlr_url_chunks
          path: url_chunks/*.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Upload master URL lists artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlr_all_sitemap_urls
          path: all_urls_*.txt
          retention-days: 2
          if-no-files-found: warn

  prepare_matrix:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Download matrix artifact
        uses: actions/download-artifact@v4
        with:
          name: dlr_matrix
      - name: Set matrix output
        id: set-matrix
        run: |
          MATRIX_CONTENT=$(cat matrix.json)
          echo "matrix=${MATRIX_CONTENT}" >> $GITHUB_OUTPUT

  scrape:
    needs: [plan, prepare_matrix]
    if: needs.plan.result == 'success' && needs.prepare_matrix.outputs.matrix != '' && needs.prepare_matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: "Scrape (${{ matrix.site_key }} - chunk ${{ matrix.chunk_index }}/${{ matrix.total_chunks }} [${{ matrix.url_count }} URLs])"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --cap-add=SYS_ADMIN

    steps:
      - uses: actions/checkout@v4

      - name: Wait for FlareSolverr to be ready
        continue-on-error: true
        run: |
          echo "Waiting for FlareSolverr service to be ready..."
          sleep 10
          for i in {1..30}; do
            if curl -s -f -X POST http://localhost:8191/v1 \
              -H "Content-Type: application/json" \
              -d '{"cmd": "sessions.list"}' > /dev/null 2>&1; then
              echo "✓ FlareSolverr is ready!"
              break
            fi
            echo "Attempt $i: FlareSolverr not ready yet..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "⚠ FlareSolverr not ready after 60 seconds, continuing anyway..."
              break
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi cloudscraper lxml

      - name: Download URL chunks
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dlr_url_chunks
          path: url_chunks

      - name: Run scraper
        env:
          CURR_URL: ${{ matrix.url }}
          SITE_NAME: ${{ matrix.site_key }}
          SITEMAP_URL: ${{ matrix.sitemap_url }}
          URLS_FILE: ${{ matrix.chunk_file }}
          CHUNK_INDEX: ${{ matrix.chunk_index }}
          TOTAL_CHUNKS: ${{ matrix.total_chunks }}
          SITEMAP_OFFSET: ${{ matrix.chunk_index }}
          MAX_SITEMAPS: 1
          MAX_URLS_PER_SITEMAP: ${{ github.event.inputs.urls_per_sitemap }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers }}
          REQUEST_DELAY: ${{ github.event.inputs.request_delay }}
          PROXY: ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          FLARESOLVERR_TIMEOUT: "120"
          FTP_HOST: ${{ env.FTP_HOST }}
          FTP_PORT: ${{ env.FTP_PORT }}
          FTP_USER: ${{ env.FTP_USER }}
          FTP_PASS: ${{ env.FTP_PASS }}
          FTP_PATH: ${{ env.FTP_PATH }}
          FTP_SYNC_ITEMS: "100"
        run: |
          echo "Starting scraper for ${{ matrix.site_key }} (chunk ${{ matrix.chunk_index }}/${{ matrix.total_chunks }}):"
          echo "URLS_FILE: ${{ matrix.chunk_file }} (${{ matrix.url_count }} URLs)"
          python drl/dlr_scraper.py || echo "Scraper finished with exit code $?"

      - name: Rescue remaining chunk data to FTP on exit
        if: always()
        env:
          FTP_HOST: ${{ env.FTP_HOST }}
          FTP_PORT: ${{ env.FTP_PORT }}
          FTP_USER: ${{ env.FTP_USER }}
          FTP_PASS: ${{ env.FTP_PASS }}
          FTP_PATH: ${{ env.FTP_PATH }}
          SITE_KEY: ${{ matrix.site_key }}
          COMPETITOR: ${{ matrix.competitor }}
          CHUNK_INDEX: ${{ matrix.chunk_index }}
        run: |
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, glob, sys
          from datetime import datetime, timezone
          sys.path.insert(0, ".")
          from ftp_manager import FTPManager, normalize_competitor_name

          host = os.environ.get("FTP_HOST", "").strip()
          user = os.environ.get("FTP_USER", "").strip()
          pass_ = os.environ.get("FTP_PASS", "").strip()
          port = int(os.environ.get("FTP_PORT", "21"))
          base_path = os.environ.get("FTP_PATH", "/scrap/").strip()
          site_key = os.environ.get("SITE_KEY", "").strip()
          comp = os.environ.get("COMPETITOR", "").strip() or normalize_competitor_name(site_key)
          date_str = datetime.now(timezone.utc).strftime("%Y%m%d")

          if not host or not user or not pass_:
              print("No FTP configured, skipping rescue upload.")
              sys.exit(0)

          csvs = glob.glob(f"products_{site_key}_chunk_*.csv") + glob.glob("products_chunk_*.csv")
          txts = glob.glob(f"url_list_{site_key}_chunk_*.txt") + glob.glob("url_list_chunk_*.txt")

          target_files = [f for f in set(csvs + txts) if os.path.exists(f) and os.path.getsize(f) > 0]
          if not target_files:
              print("No chunk files found to rescue.")
              sys.exit(0)

          print(f"Rescuing {len(target_files)} chunk file(s) to FTP for {comp}...")
          ftp = FTPManager(host=host, user=user, pass_=pass_, port=port, base_dir=base_path)
          remote_temp_dir = f"{base_path.rstrip('/')}/{comp}/{date_str}/output/temp"

          for local_f in target_files:
              remote_f = f"{remote_temp_dir}/{os.path.basename(local_f)}"
              ftp.upload_file(local_f, remote_f)

          ftp.disconnect()
          print("Rescue upload step complete.")
          EOF

      - name: Upload chunk (even on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk_${{ matrix.site_key }}_${{ matrix.chunk_index }}
          path: |
            products_*_chunk_*.csv
            products_chunk_*.csv
            url_list_*_chunk_*.txt
            url_list_chunk_*.txt
          if-no-files-found: warn

  merge:
    needs: [plan, scrape]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk_*
          merge-multiple: true

      - name: Download master URL lists
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dlr_all_sitemap_urls
          path: master_urls

      - name: Process each site (Merge CSV, Track URLs, Prepare FTP)
        id: process_sites
        run: |
          mkdir -p chunks master_urls ftp_output
          DATE=$(date +%Y%m%d)
          TIMESTAMP=$(date +%Y%m%d%H%M)
          FILE_DATE=$(date +%F_%H%M%S)

          echo "Listing all downloaded chunk files:"
          find chunks -type f | sort || true

          # Detect all site keys present in chunks
          SITE_KEYS=$(find chunks -name "products_*_chunk_*.csv" 2>/dev/null | sed -E 's|.*/products_([^_]+)_chunk_.*|\1|' | sort -u)
          if [ -z "$SITE_KEYS" ]; then
            SITE_KEYS="discountlivingrooms"
          fi

          echo "Sites detected for processing: $SITE_KEYS"

          for SITE in $SITE_KEYS; do
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo " Processing Site: $SITE"
            echo "════════════════════════════════════════════════════════════"

            # 1. Merge CSV chunks
            SITE_CSVS=$(find chunks -name "products_${SITE}_chunk_*.csv" 2>/dev/null)
            if [ -z "$SITE_CSVS" ]; then
              SITE_CSVS=$(find chunks -name "products_chunk_*.csv" 2>/dev/null)
            fi

            OUTPUT_FILE="${SITE}_${FILE_DATE}.csv"
            if [ -n "$SITE_CSVS" ]; then
              FIRST_FILE=$(echo "$SITE_CSVS" | head -n 1)
              head -n 1 "$FIRST_FILE" > "$OUTPUT_FILE"
              for f in $SITE_CSVS; do
                tail -n +2 "$f" 2>/dev/null | sed '/^$/d' >> "$OUTPUT_FILE"
              done
              ROW_COUNT=$(wc -l < "$OUTPUT_FILE" | tr -d ' ')
              echo "✓ Merged $OUTPUT_FILE ($ROW_COUNT rows)"
            else
              echo "⚠ No CSV chunks found for $SITE"
              touch "$OUTPUT_FILE"
            fi

            # 2. Merge URL list
            URL_FILE="all_sitemap_urls_${SITE}.txt"
            if [ -f "master_urls/all_urls_${SITE}.txt" ]; then
              cp "master_urls/all_urls_${SITE}.txt" "$URL_FILE"
            else
              SITE_URLS=$(find chunks -name "url_list_${SITE}_chunk_*.txt" 2>/dev/null)
              if [ -z "$SITE_URLS" ]; then
                SITE_URLS=$(find chunks -name "url_list_chunk_*.txt" 2>/dev/null)
              fi
              if [ -n "$SITE_URLS" ]; then
                cat $SITE_URLS | sort -u > "$URL_FILE"
              else
                touch "$URL_FILE"
              fi
            fi
            URL_COUNT=$(wc -l < "$URL_FILE" | tr -d ' ')
            echo "✓ Unique sitemap URLs for $SITE: $URL_COUNT"

            # 3. Determine Competitor name for FTP
            case "$SITE" in
              bedroomfurniturediscounts) COMPETITOR="Bedroomfurniturediscounts" ;;
              diningroomsoutlet)         COMPETITOR="DiningRoomsOutlet" ;;
              tvstandsoutlet)            COMPETITOR="TvStandsOutlet" ;;
              *)                         COMPETITOR="DiscountLivingRooms" ;;
            esac

            # 4. Prepare standard FTP directory structure
            INPUT_DIR="ftp_output/${COMPETITOR}/${DATE}/input"
            TEMP_DIR="ftp_output/${COMPETITOR}/${DATE}/output/temp"
            FINAL_DIR="ftp_output/${COMPETITOR}/${DATE}/output"

            mkdir -p "$INPUT_DIR" "$TEMP_DIR" "$FINAL_DIR"

            INPUT_URL="$INPUT_DIR/URLList${TIMESTAMP}.csv"
            TEMP_URL="$TEMP_DIR/URLListForScrap${TIMESTAMP}.csv"
            FINAL_SCRAPED="$FINAL_DIR/FinalScrappedData${TIMESTAMP}.csv"
            FINAL_URL="$FINAL_DIR/FinalURLListForScrap${TIMESTAMP}.csv"

            cp "$URL_FILE" "$INPUT_URL" 2>/dev/null || true
            cp "$URL_FILE" "$TEMP_URL" 2>/dev/null || true
            cp "$OUTPUT_FILE" "$FINAL_SCRAPED" 2>/dev/null || true

            # 5. Generate FinalURLListForScrap (Scraped vs Not Scraped tracking)
            if [ -f "$TEMP_URL" ] && [ -f "$FINAL_SCRAPED" ] && [ -s "$FINAL_SCRAPED" ]; then
              python3 ftp_manager.py track-urls --sitemap-file "$TEMP_URL" --scraped-file "$FINAL_SCRAPED" --output-file "$FINAL_URL" || true
            fi

            # 6. Upload to FTP server if configured
            if [ -n "$FTP_HOST" ]; then
              echo "Uploading $COMPETITOR output to FTP server..."
              python3 ftp_manager.py upload -c "$COMPETITOR" -b ftp_output || {
                echo "ftp_manager upload failed, falling back to lftp..."
                which lftp >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y lftp)
                BASE="${FTP_PATH}/${COMPETITOR}/${DATE}"
                lftp -e "set ftp:ssl-allow no; mirror -R ftp_output/${COMPETITOR}/${DATE} ${BASE}; bye" -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" || true
                echo "FTP upload complete: ${BASE}"
              } || true
            fi
          done

          echo ""
          echo "FTP Output structure created:"
          find ftp_output -type f | sort

      - name: Archive separate CSV results per site
        uses: actions/upload-artifact@v4
        with:
          name: site_products_csvs
          path: "*_[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]_*.csv"
          retention-days: 7
          if-no-files-found: warn